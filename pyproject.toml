[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simproxy"
version = "0.1.0.dev0"
description = "SimPoint-based synthetic proxy generator for ARM64 program simulation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SimProxy contributors" }]
keywords = ["simpoint", "dynamorio", "qemu", "simulation", "arm64"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
parquet = ["pyarrow>=12"]
dev = ["build>=1.0", "pytest>=7", "ruff>=0.4"]
all = ["build>=1.0", "pyarrow>=12", "pytest>=7", "ruff>=0.4"]

[project.scripts]
simproxy = "simproxy.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
simproxy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
